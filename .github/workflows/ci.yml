name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build          # type-checks every workspace and builds the frontend
      - run: npm test               # backend unit tests
      - run: npm run test:frontend   # frontend state tests
      - name: Start DynamoDB Local
        run: docker run -d --name dynamodb -p 8100:8000 amazon/dynamodb-local -jar DynamoDBLocal.jar -inMemory -sharedDb
      - run: npm run test:integration
